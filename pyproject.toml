[project]
name = "rdf-extraction"
version = "0.9.0"
description = "Transforms XML files based on the Orlando Project schema into RDF"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "lxml>=6.0.2",
    "pandas>=2.3.3",
    "rdflib>=7.2.1",
    "unidecode>=1.4.0",
]
