[project]
name = "rdf-extraction"
version = "0.9.0"
description = "Transforms XML files based on the Orlando Project schema into RDF"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "fuzzywuzzy>=0.18.0",
    "lxml>=6.0.2",
    "pandas>=2.3.3",
    "rdflib>=7.2.1",
    "requests>=2.32.5",
    "unidecode>=1.4.0",
]
ignore = ["venv", ".venv", "__pycache__", "build"]

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "logging-fstring-interpolation",
]
